<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  />

  <title>Reset BearTrack Password</title>

  <script src="../config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --navy: #08243b;
      --panel: #17364f;
      --gold: #f5b83b;
      --text: #f7fbff;
      --muted: #a9bdd0;
      --line: #29465d;
      --error: #ef4d43;
      --success: #42d36e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Inter, Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #15334d 0, #071b2c 45%, #051522 100%);
    }

    .card {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: var(--muted);
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 800;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 13px;
      border: 0;
      border-radius: 11px;
      background: var(--gold);
      color: #08243b;
      font: inherit;
      font-weight: 900;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      display: none;
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 10px;
    }

    #message.error {
      display: block;
      border: 1px solid var(--error);
      background: rgba(239, 77, 67, 0.15);
    }

    #message.success {
      display: block;
      border: 1px solid var(--success);
      background: rgba(66, 211, 110, 0.15);
    }
  </style>
</head>

<body>
  <main class="card">
    <h1>Choose a new password</h1>

    <p>
      Enter a new password for your BearTrack account.
    </p>

    <div id="message"></div>

    <label for="newPassword">New password</label>
    <input
      id="newPassword"
      type="password"
      minlength="8"
      autocomplete="new-password"
    />

    <label for="confirmPassword">Confirm new password</label>
    <input
      id="confirmPassword"
      type="password"
      minlength="8"
      autocomplete="new-password"
    />

    <button id="savePasswordBtn" type="button">
      Save New Password
    </button>
  </main>

  <script src="../js/supabase.js?v=20260806-1300"></script>

  <script>
    (() => {
      'use strict';

      const button =
        document.getElementById('savePasswordBtn');

      const message =
        document.getElementById('message');

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
      }

      button.addEventListener('click', async () => {
        const password =
          document.getElementById('newPassword').value;

        const confirmation =
          document.getElementById('confirmPassword').value;

        if (password.length < 8) {
          showMessage(
            'Password must be at least 8 characters.',
            'error'
          );
          return;
        }

        if (password !== confirmation) {
          showMessage(
            'The passwords do not match.',
            'error'
          );
          return;
        }

        try {
          button.disabled = true;
          button.textContent = 'Saving...';

          await window.BearTrackDB.updatePassword(password);

          showMessage(
            'Password updated. Returning to BearTrack...',
            'success'
          );

          setTimeout(() => {
            window.location.href = './index.html';
          }, 1500);
        } catch (error) {
          showMessage(
            error.message ||
              'Unable to update the password. Request a new reset email.',
            'error'
          );
        } finally {
          button.disabled = false;
          button.textContent = 'Save New Password';
        }
      });
    })();
  </script>
</body>
</html>
