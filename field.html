<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BearOps Field</title><link rel="stylesheet" href="field.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body>
<header class="topbar"><div><h1>BearOps Field</h1><p>45-Minute Home Health Assessment</p></div><div><a href="app.html">Dashboard</a><button id="logoutBtn">Log Out</button></div></header>
<main>
<section id="loginView" class="card login"><h2>Login</h2><label>Email<input id="loginEmail" type="email"></label><label>Password<input id="loginPassword" type="password"></label><button id="loginBtn">Log In</button><p id="loginMsg"></p></section>
<section id="appView" class="hidden">
<section class="card" id="setupCard"><h2>Start Inspection</h2><div class="grid"><label>Customer Name<input id="customerName"></label><label>Email<input id="customerEmail"></label><label>Phone<input id="customerPhone"></label><label>Property Address<input id="propertyAddress"></label><label>City<input id="propertyCity"></label><label>State<input id="propertyState" value="FL"></label><label>Zip<input id="propertyZip"></label><label>Technician<input id="technician"></label></div><button id="startBtn">Create / Start Inspection</button></section>
<section id="inspectionCard" class="hidden"><div class="progress-card"><div><h2 id="sectionTitle"></h2><p id="itemCounter"></p></div><div class="scorebox"><span>Home Health Score™</span><strong id="score">100</strong></div></div><div class="progressbar"><div id="bar"></div></div>
<article class="card item-card"><p class="eyebrow" id="categoryLabel"></p><h2 id="itemTitle"></h2><p id="educationText"></p><div class="choice-grid"><button class="choice" data-status="Good">Good</button><button class="choice" data-status="Monitor">Monitor</button><button class="choice" data-status="Service Soon">Service Soon</button><button class="choice danger" data-status="Needs Repair">Needs Repair</button></div>
<div class="grid"><label>Risk Points<input id="riskPoints" type="number" value="0"></label><label>Estimated Hours<input id="estimatedHours" type="number" step=".25" value="0"></label><label>Cost Range<input id="costRange" placeholder="$100 - $300"></label><label>Work Order Needed<select id="workOrderNeeded"><option>No</option><option>Yes</option></select></label></div><label>Observation<textarea id="observation" placeholder="What did you find?"></textarea></label><label>Recommendation<textarea id="recommendation"></textarea></label><div class="navbuttons"><button id="prevBtn">Back</button><button id="saveItemBtn">Save Item</button><button id="nextBtn">Next</button></div></article>
<section class="card finish hidden" id="finishCard"><h2>Inspection Complete</h2><div class="finish-grid"><div><span>Score</span><strong id="finalScore">100</strong></div><div><span>Risk</span><strong id="finalRisk">Low</strong></div><div><span>Hours</span><strong id="finalHours">0</strong></div><div><span>Work Orders</span><strong id="finalWO">0</strong></div></div><button id="generateReportBtn">Generate Report</button><button id="createWorkOrdersBtn">Create Work Orders</button><textarea id="reportText"></textarea></section>
</section></section></main><div id="toast"></div><script src="field.js"></script></body></html>
