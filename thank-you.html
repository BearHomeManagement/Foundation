<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request Received | Bear Home Management</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .thanks-wrap{min-height:80vh;display:flex;align-items:center;justify-content:center;padding:40px;text-align:center;background:linear-gradient(135deg,#062b35,#1f4a34);color:#fff}
    .thanks-card{max-width:720px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:24px;padding:48px;box-shadow:0 20px 70px rgba(0,0,0,.25)}
    .thanks-card h1{font-size:clamp(2.2rem,5vw,4rem);margin:0 0 16px}
    .thanks-card p{font-size:1.2rem;line-height:1.6}
    .thanks-card a{display:inline-block;margin-top:22px;background:#efb649;color:#061b22;padding:14px 22px;border-radius:12px;text-decoration:none;font-weight:800}
  </style>
</head>
<body>
  <main class="thanks-wrap">
    <section class="thanks-card">
      <h1>Request received.</h1>
      <p>Thank you for contacting Bear Home Management. We’ll review your request and follow up shortly.</p>
      <a href="/">Return Home</a>
    </section>
  </main>
</body>
</html>
